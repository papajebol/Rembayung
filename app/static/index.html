<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAU/USD Intelligence</title>
  <style>
    body{margin:0;font-family:Inter,system-ui;background:#0e1117;color:#d6deeb}
    header{padding:14px 18px;background:#131722;border-bottom:1px solid #212936;position:sticky;top:0}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:8px 12px;background:#1a2030;border-radius:8px;cursor:pointer}
    .tab.active{background:#2d3a57}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;padding:14px}
    .card{background:#131722;border:1px solid #222b3b;border-radius:12px;padding:12px}
    .meta{font-size:12px;color:#99a7bd;margin-top:8px}
    pre{white-space:pre-wrap;font-size:12px}
  </style>
</head>
<body>
<header>
  <h2 style="margin:0 0 10px">LIVE XAU/USD Intelligence Dashboard</h2>
  <div class="tabs" id="tabs"></div>
</header>
<main class="grid" id="grid"></main>
<script>
const sections = {
  Overview:["market","trade_board","regime","intermarket"],
  Technical:["technical","price_action"],
  Volume:["volume","commitment_divergence"],
  Macro:["fundamentals","events"],
  News:["news"],
  COT:["cot"],
  "Data Integrity":["integrity"]
};
let state={}; let active='Overview';
function initTabs(){const t=document.getElementById('tabs');Object.keys(sections).forEach(s=>{const b=document.createElement('div');b.className='tab'+(s===active?' active':'');b.textContent=s;b.onclick=()=>{active=s;[...t.children].forEach(c=>c.classList.remove('active'));b.classList.add('active');render()};t.appendChild(b)})}
function card(title,data,meta){return `<div class='card'><h3>${title}</h3><pre>${JSON.stringify(data,null,2)}</pre><div class='meta'>Source: ${meta.source||'n/a'}<br/>Updated: ${meta.last_updated||'n/a'}<br/>Freshness: ${meta.freshness||'n/a'}<br/>Status: ${meta.status||'n/a'}</div></div>`}
function render(){const g=document.getElementById('grid');g.innerHTML='';for(const key of sections[active]){if(key==='integrity'){const i=state.integrity||{};g.innerHTML+=`<div class='card'><h3>Data Integrity</h3><pre>${JSON.stringify(i,null,2)}</pre></div>`;continue;}const mod=state.modules?.[key]||{message:'Source Unavailable',meta:{status:'failing'}};const meta=mod.meta||{};const copy={...mod};delete copy.meta;g.innerHTML+=card(key,copy,meta)}}
function connect(){fetch('/api/snapshot').then(r=>r.json()).then(d=>{state=d;render()});const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=(e)=>{state=JSON.parse(e.data);render()};setInterval(()=>ws.readyState===1&&ws.send('ping'),20000)}
initTabs();connect();
</script>
</body>
</html>
